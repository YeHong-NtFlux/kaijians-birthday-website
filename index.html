<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title></title>
<style>
:root{
--violet:#7b5cf0; --violet-d:#4a3ba8; --pink:#ff9ecb; --cream:#fff7ea;
--ink:#fff; --sub:#c9b6ff; --paper:rgba(20,14,50,.55);
--ease:cubic-bezier(.34,.05,.2,1); --ease2:cubic-bezier(.2,.7,.3,1);
color-scheme:dark;
forced-color-adjust:none;
}
@media (forced-colors:active){
:root{--ink:#fff;--sub:#c9b6ff;}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#05030f;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
color:#fff;}
#stage, #lightbox, .vignette{-webkit-filter:none;filter:none;transition:opacity 1.2s ease;}
img,figure{forced-color-adjust:none;}
@media (prefers-color-scheme:dark){
img{-webkit-filter:none;filter:none;}
}
#stage{position:fixed;inset:0;}
#stars{position:absolute;inset:0;z-index:0;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.8;animation:tw 3s ease-in-out infinite;}
.star.b{width:3px;height:3px;box-shadow:0 0 6px rgba(255,255,255,.8);}
.star.s{width:1.5px;height:1.5px;opacity:.5;}
.star.m{width:2px;height:2px;}
@keyframes tw{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.spark{position:absolute;width:26px;height:26px;opacity:0;animation:sparkIn 4s ease-in-out infinite;}
.spark::before,.spark::after{content:"";position:absolute;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);}
.spark::before{left:0;right:0;top:50%;height:1px;transform:translateY(-50%);}
.spark::after{top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:linear-gradient(transparent,rgba(255,255,255,.95),transparent);}
@keyframes sparkIn{0%,100%{opacity:0;transform:rotate(0) scale(.6)}20%{opacity:.9;transform:rotate(45deg) scale(1.15)}40%{opacity:0;transform:rotate(90deg) scale(.6)}}
.shoot{position:absolute;width:140px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.9),transparent);
transform:rotate(-28deg);opacity:0;pointer-events:none;}
@keyframes shoot{0%{opacity:0;transform:rotate(-28deg) translateX(0)}10%{opacity:1}100%{opacity:0;transform:rotate(-28deg) translateX(-420px)}}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
transition:opacity 1.2s ease, filter 1.2s ease;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
will-change:opacity,transform;}
.hide{opacity:0;pointer-events:none;filter:brightness(.4);}
#doorScreen{ z-index:4;} #cakeScreen{ z-index:3;} #spaceScreen{ z-index:2;} #wishScreen{ z-index:1;}
#wishScreen.show{ z-index:5;}
/* ============ 门 ============ */
#doorWrap{--dw:min(42vh,30vw,72vw); --dh:calc(var(--dw) * 1.6);
width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:clamp(18px,4vh,40px);padding:clamp(20px,5vh,48px) clamp(16px,5vw,40px);box-sizing:border-box;}
.door-frame{position:relative;width:var(--dw);height:var(--dh);max-width:90vw;max-height:66vh;
perspective:1400px;transform-style:preserve-3d;flex:none;
filter:drop-shadow(0 30px 60px rgba(90,60,200,.35));}
.mold{position:absolute;inset:calc(var(--dw) * -0.06);border-radius:calc(var(--dw) * 0.035);
background:linear-gradient(160deg,#5b46b4,#241a5c 55%,#0c0826);
box-shadow:0 40px 90px rgba(0,0,0,.75),0 0 70px rgba(150,110,255,.4) inset,0 0 60px rgba(130,100,255,.35);
border:1px solid rgba(210,190,255,.45);}
.mold::before{content:"";position:absolute;inset:calc(var(--dw) * 0.022);border-radius:calc(var(--dw) * 0.022);
border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 calc(var(--dw)*.13) rgba(0,0,0,.6);}
.lintel{position:absolute;top:calc(var(--dw) * -0.18);left:50%;transform:translateX(-50%);
width:calc(var(--dw) * 0.32);aspect-ratio:1;opacity:.95;animation:lintelFloat 5s ease-in-out infinite;}
.lintel i{position:absolute;left:50%;top:50%;width:100%;height:1.5px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate(-50%,-50%);border-radius:1px;box-shadow:0 0 8px rgba(255,255,255,.8);}
.lintel i:nth-child(2){width:1.5px;height:100%;background:linear-gradient(transparent,#fff,transparent);transform:translate(-50%,-50%);}
.lintel i:nth-child(3){width:70%;transform:translate(-50%,-50%) rotate(45deg);opacity:.55;}
.lintel i:nth-child(4){height:70%;transform:translate(-50%,-50%) rotate(45deg);opacity:.55;}
.lintel::after{content:"";position:absolute;inset:18%;border-radius:50%;
background:radial-gradient(circle,#fff9,rgba(190,150,255,.5),transparent);filter:blur(3px);}
@keyframes lintelFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.doorlight{position:absolute;inset:calc(var(--dw) * -0.2);border-radius:calc(var(--dw) * 0.05);
background:radial-gradient(ellipse at 50% 55%,rgba(200,160,255,.6),rgba(130,100,255,.22) 45%,transparent 72%);
filter:blur(calc(var(--dw) * 0.1));opacity:.5;transition:opacity 1.6s ease,filter 1.6s ease;animation:seam 3.4s ease-in-out infinite;}
@keyframes seam{0%,100%{opacity:.38}50%{opacity:.8}}
.leaf{position:absolute;left:0;top:0;width:50.4%;height:100%;transform-origin:left center;
transition:transform 2.6s var(--ease);transform-style:preserve-3d;}
.leaf.r{left:49.6%;transform-origin:right center;}
.face{position:absolute;inset:0;border-radius:calc(var(--dw) * 0.02);overflow:hidden;backface-visibility:hidden;
background:linear-gradient(165deg,#3d2d8c 0%,#211856 52%,#0b0824 100%);
box-shadow:inset 0 0 calc(var(--dw)*.11) rgba(0,0,0,.65);border:1px solid rgba(200,180,255,.32);}
.face::before{content:"";position:absolute;inset:calc(var(--dw)*.05);border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--dw)*.015);}
.face::after{content:"";position:absolute;left:50%;top:14%;bottom:8%;width:calc(var(--dw)*.035);transform:translateX(-50%);border-radius:2px;
background:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 20%,rgba(0,0,0,.55) 80%,transparent),
linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);}
.face .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 45%,transparent 55%);
animation:sheen 6s ease-in-out infinite;pointer-events:none;}
@keyframes sheen{0%,100%{transform:translateX(-30%)}50%{transform:translateX(30%)}}
.edge{position:absolute;top:0;bottom:0;width:calc(var(--dw)*.038);background:linear-gradient(90deg,rgba(255,255,255,.32),rgba(255,255,255,0));backface-visibility:hidden;}
.leaf.l .edge{right:0;transform-origin:right;transform:rotateY(90deg);}
.leaf.r .edge{left:0;transform-origin:left;transform:rotateY(-90deg);}
.knob{position:absolute;top:56%;width:calc(var(--dw)*.052);height:calc(var(--dw)*.052);border-radius:50%;
background:radial-gradient(circle at 35% 30%,#ffe6c4,#c99a4a);box-shadow:0 0 calc(var(--dw)*.045) rgba(255,200,130,.75),inset -2px -2px 4px rgba(0,0,0,.3);}
.leaf.l .knob{right:calc(var(--dw)*.058);}
.leaf.r .knob{left:calc(var(--dw)*.058);}
.door-open .leaf.l{transform:rotateY(-128deg) rotateX(2deg);}
.door-open .leaf.r{transform:rotateY(128deg) rotateX(2deg);}
.door-open .doorlight{opacity:1;animation:none;filter:blur(calc(var(--dw) * 0.05));}
.door-open .lintel{animation:none;opacity:1;}
.portal{position:absolute;inset:calc(var(--dw) * 0.02);border-radius:calc(var(--dw) * 0.015);overflow:hidden;
background:radial-gradient(ellipse at 50% 35%,#5a30c8 0%,#311880 45%,#d09be8 74%,#ffdfd0 100%);
opacity:0;transform:scale(.94);transition:opacity 1.8s ease .35s,transform 2.4s var(--ease) .35s;
box-shadow:inset 0 0 calc(var(--dw)*.22) rgba(255,225,255,.6);}
.portal .planet{position:absolute;right:-12%;top:14%;width:48%;aspect-ratio:1;border-radius:50%;
background:radial-gradient(circle at 32% 30%,#e8cdff,#7a55ff 50%,#241463);box-shadow:0 0 calc(var(--dw)*.15) rgba(190,140,255,.75);animation:planetDrift 9s ease-in-out infinite;}
.portal .ring{position:absolute;right:-26%;top:32%;width:76%;height:15%;border-radius:50%;
border:calc(var(--dw)*.012) solid rgba(245,220,255,.7);transform:rotate(-16deg);box-shadow:0 0 calc(var(--dw)*.08) rgba(235,190,255,.6);}
@keyframes planetDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-4%,2%)}}
.portal .stars2{position:absolute;inset:-10%;
background:radial-gradient(1.4px 1.4px at 20% 25%,#fff,rgba(255,255,255,0) 60%),
radial-gradient(1.8px 1.8px at 70% 18%,#fff,rgba(255,255,255,0) 60%),
radial-gradient(1.2px 1.2px at 45% 60%,#fff,rgba(255,255,255,0) 60%),
radial-gradient(1.2px 1.2px at 82% 72%,#fff,rgba(255,255,255,0) 60%),
radial-gradient(1.4px 1.4px at 12% 78%,#fff,rgba(255,255,255,0) 60%),
radial-gradient(1px 1px at 60% 40%,#fff,rgba(255,255,255,0) 60%);opacity:.95;animation:driftBg 40s linear infinite;}
@keyframes driftBg{to{transform:translate(-6%,-4%)}}
.portal .horizon{position:absolute;left:0;right:0;bottom:0;height:44%;
background:linear-gradient(0deg,rgba(255,210,230,.65),rgba(180,130,255,.28) 55%,transparent);filter:blur(5px);}
.door-open .portal{opacity:1;transform:scale(1);}
#lock{width:100%;max-width:min(440px,86vw);text-align:center;color:#ddd6ff;
display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,18px);}
#lock .title{font-size:clamp(15px,3.6vw,22px);letter-spacing:.35em;font-weight:600;
background:linear-gradient(180deg,#fff,#dcc6ff);-webkit-background-clip:text;background-clip:text;color:transparent;
text-shadow:0 0 24px rgba(190,150,255,.4);}
#lock .hint{font-size:clamp(11px,2.6vw,13px);letter-spacing:.28em;opacity:.62;line-height:1.7;}
.pwd-shell{position:relative;width:100%;}
#pwd{width:100%;padding:clamp(12px,3.2vh,17px) clamp(16px,4vw,22px);
font-size:clamp(15px,4vw,19px);letter-spacing:.5em;text-align:center;
background:var(--paper);border:1px solid rgba(180,150,255,.45);border-radius:40px;color:#fff;outline:none;
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.32s;caret-color:var(--pink);}
#pwd::placeholder{letter-spacing:.3em;color:rgba(220,210,255,.35);font-size:.85em;}
#pwd:focus{box-shadow:0 0 0 3px rgba(180,140,255,.35),0 0 34px rgba(190,140,255,.6);border-color:rgba(225,195,255,.9);transform:translateY(-1px);}
.enter-btn{width:100%;padding:clamp(11px,3vh,16px);font-size:clamp(13px,3.4vw,16px);letter-spacing:.4em;
color:#fff;border:none;border-radius:40px;cursor:pointer;font-family:inherit;font-weight:600;
background:linear-gradient(90deg,#7b5cf0,#b06bf0,#e07ad0);background-size:200% 100%;background-position:0% 50%;
box-shadow:0 12px 30px rgba(140,90,230,.5);transition:.34s;}
.enter-btn:hover{background-position:100% 50%;transform:translateY(-1px);box-shadow:0 16px 36px rgba(150,100,230,.6);}
.enter-btn:active{transform:scale(.98) translateY(0);filter:brightness(1.12);}
#err{height:clamp(14px,3vh,18px);font-size:clamp(11px,2.8vw,13px);letter-spacing:.2em;color:#ff9bb0;opacity:0;transition:.4s;}
#err.show{opacity:1;}
.shake{animation:sh .55s;}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.typing{display:inline-block;overflow:hidden;white-space:nowrap;border-right:2px solid rgba(220,200,255,.7);
animation:caret 1s steps(1) infinite;}
@keyframes caret{50%{border-color:transparent}}
@media (min-width:820px) and (orientation:landscape){
#doorWrap{--dw:min(22vw,360px);flex-direction:row;gap:clamp(40px,6vw,80px);}
#lock{width:min(28vw,340px);}
}
@media (max-height:620px){
#doorWrap{--dw:min(26vh,34vw);gap:14px;}
#lock .title{display:none;}
}
#cakeScreen{background:radial-gradient(ellipse at 50% 75%,rgba(110,70,220,.4),transparent 65%),#07041a;
padding:clamp(20px,5vh,48px) clamp(16px,5vw,40px);}
.cake-group{position:relative;width:min(78vw,380px);max-height:70vh;margin:auto;padding-top:20px;}
.glow-base{position:absolute;left:50%;top:34%;width:130%;height:60px;height:clamp(40px,10vw,80px);aspect-ratio:1.6;transform:translate(-50%,-50%);
background:radial-gradient(circle,rgba(255,215,160,.6),transparent 65%);filter:blur(26px);-webkit-filter:blur(26px);opacity:0;}
.tier{position:relative;margin:0 auto;border-radius:14px 14px 20px 20px;
background:linear-gradient(180deg,#8a6cf6,#4a3ba8 58%,#2c2370);
box-shadow:0 14px 44px rgba(0,0,0,.55),inset 0 4px 14px rgba(255,255,255,.22);}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;border-radius:14px 14px 0 0;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);}
.tier::after{content:"";position:absolute;left:6%;right:6%;top:8px;height:10px;border-radius:0 0 50% 50%;
background:radial-gradient(circle at 50% 0,rgba(255,255,255,.55),transparent 70%);filter:blur(1px);-webkit-filter:blur(1px);}
.t1{width:100%;height:clamp(48px,15vw,76px);}
.t2{width:74%;height:clamp(38px,12vw,60px);margin-top:-6px;}
.plate{width:118%;height:clamp(16px,5.5vw,28px);margin:-4px auto 0;border-radius:0 0 30px 30px;
background:linear-gradient(180deg,#6656d4,#2a2370);box-shadow:0 20px 50px rgba(0,0,0,.6);}
.candle{position:absolute;left:50%;top:0;transform:translate(-50%,-100%);width:clamp(14px,4.5vw,22px);height:clamp(44px,14vw,70px);}
.candle-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:clamp(9px,3vw,14px);height:100%;
border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#fff6f0,#e7d3ff 58%,#b79aee);
box-shadow:inset 0 0 8px rgba(255,255,255,.85);}
.wick{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:2px;height:10px;background:#5a4a30;}
.flame{position:absolute;top:-34px;left:50%;transform:translateX(-50%) scale(0);
width:clamp(16px,5vw,24px);height:clamp(24px,7vw,34px);border-radius:50% 50% 50% 40%;
background:radial-gradient(ellipse at 50% 30%,#fff7e0 0%,#ffd27a 40%,#ff7a3a 78%,transparent 100%);
filter:blur(1px) drop-shadow(0 0 18px rgba(255,190,110,.8));-webkit-filter:blur(1px) drop-shadow(0 0 18px rgba(255,190,110,.8));transform-origin:50% 90%;will-change:transform,opacity;}
.flame::after{content:"";position:absolute;left:50%;top:40%;transform:translateX(-50%);width:35%;height:55%;
border-radius:50%;background:rgba(255,255,255,.9);filter:blur(1px);-webkit-filter:blur(1px);}
.lit .flame{animation:flameOn .5s ease forwards,flicker 1.6s ease-in-out infinite .5s;}
@keyframes flameOn{to{transform:translateX(-50%) scale(1);}}
@keyframes flicker{0%,100%{transform:translateX(-50%) scale(1) rotate(-1.5deg)}50%{transform:translateX(-50%) scale(1.06,.94) rotate(1.5deg)}}
.lit .glow-base{animation:glowOn 1.2s ease forwards;}
@keyframes glowOn{to{opacity:1;}}
.smoke{position:absolute;top:-50px;left:50%;width:6px;height:6px;border-radius:50%;background:rgba(225,215,255,.55);filter:blur(3px);-webkit-filter:blur(3px);opacity:0;}
.blow{position:absolute;left:50%;bottom:-45px;bottom:clamp(-45px,-10vh,-35px);transform:translateX(-50%);
font-size:12px;font-size:clamp(11px,2.8vw,13px);letter-spacing:.3em;color:#dcc6ff;opacity:0;
white-space:normal;text-align:center;width:90vw;max-width:300px;line-height:1.6;
transition:.6s;pointer-events:none;}
.blow.on{opacity:.85;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
#spaceScreen{background:#03020c;overflow:hidden;}
.planet-big{position:absolute;width:min(180vh,160vw);height:min(180vh,160vw);border-radius:50%;
right:-40vw;top:-22vh;transform:translateZ(0);
background:radial-gradient(circle at 28% 32%,#7cc0ff 0%,#3a6cf0 22%,#1a2a8a 55%,#0a0e3a 100%);
box-shadow:inset -8vw -6vw 18vw rgba(0,0,0,.5),0 0 14vw rgba(80,140,255,.25);}
.planet-big::after{content:"";position:absolute;inset:0;border-radius:50%;
background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.13) 55%,transparent 70%);}
.p-small{position:absolute;width:clamp(56px,15vw,96px);aspect-ratio:1;border-radius:50%;
background:radial-gradient(circle at 30% 30%,#9fb6ff,#3148c4 60%,#10174a);box-shadow:0 0 30px rgba(120,150,255,.5);}
.p-small.ringed{box-shadow:none;}
.p-small.ringed::before{content:"";position:absolute;left:-35%;top:38%;width:170%;height:22%;border-radius:50%;
border:clamp(2px,0.5vw,3.5px) solid rgba(210,200,255,.6);transform:rotate(-20deg);}
.nebula{position:absolute;border-radius:50%;filter:blur(60px);-webkit-filter:blur(60px);opacity:.5;}
.n1{width:90vw;height:90vw;left:-30vw;bottom:-20vw;background:radial-gradient(circle,rgba(180,110,255,.5),transparent 65%);}
.n2{width:70vw;height:70vw;right:-20vw;bottom:10vw;background:radial-gradient(circle,rgba(255,130,180,.35),transparent 65%);}
.n3{width:60vw;height:60vw;left:20vw;top:-18vw;background:radial-gradient(circle,rgba(110,200,255,.28),transparent 65%);}
#wishScreen{background:radial-gradient(ellipse at 50% 38%,rgba(150,100,255,.3),transparent 60%),#050314;
padding:clamp(24px,6vh,56px) clamp(20px,6vw,48px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.wish{text-align:center;color:#fff;width:100%;max-width:780px;margin:auto;padding:clamp(10px,3vh,24px) 0;}
.gf{position:relative;display:block;
background:linear-gradient(180deg,#ffffff 28%,#ffe0f5 56%,#d4b8ff 88%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
color:#fff;padding-bottom:.05em;}
@supports ((background-clip:text) or (-webkit-background-clip:text)){
.gf{color:transparent;}
}
.wish .en{font-size:clamp(11px,3.2vw,17px);letter-spacing:.6em;text-transform:uppercase;
color:#c9b6ff;opacity:.8;margin-bottom:clamp(14px,3.5vh,22px);font-weight:500;}
.wish .cn{font-size:clamp(27px,8.8vw,52px);letter-spacing:clamp(2px,1.2vw,8px);font-weight:800;
line-height:1.5;-webkit-text-fill-color:transparent;}
.wish .sub{margin-top:clamp(16px,4vh,26px);font-size:clamp(13px,3.8vw,17px);letter-spacing:.16em;
color:#c3b4ea;line-height:2;font-weight:400;}
.wish .line{width:clamp(90px,26vw,140px);height:1px;margin:clamp(20px,5vh,30px) auto 0;
background:linear-gradient(90deg,transparent,#c9b6ff,transparent);}
.hub{margin:clamp(22px,5vh,34px) auto 0;max-width:560px;border-radius:20px;overflow:hidden;
background:rgba(16,10,44,.72);border:1px solid rgba(210,190,255,.3);
box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 40px rgba(150,110,255,.18) inset;
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:left;transform:translateY(18px);opacity:0;transition:all 1.2s var(--ease2);}
.hub.in{opacity:1;transform:translateY(0);}
.hub figure{position:relative;margin:0;aspect-ratio:1041/610;overflow:hidden;background:#0a0620;}
.hub figure img{width:100%;height:100%;display:block;object-fit:cover;opacity:0;transform:scale(1.06);
transition:opacity 1.4s ease .15s,transform 6s ease-out;}
.hub.in figure img{opacity:1;transform:scale(1);}
.hub figure .badge{position:absolute;left:10px;top:10px;z-index:3;font-size:clamp(9px,2.4vw,11px);
letter-spacing:.24em;color:#fff;padding:5px 11px;border-radius:99px;line-height:1.4;
background:rgba(8,4,24,.6);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.4);}
.hub figure .zoom{position:absolute;right:10px;top:10px;z-index:4;font-size:clamp(10px,2.6vw,12px);
letter-spacing:.16em;color:#fff;padding:9px 14px 9px 12px;border-radius:99px;cursor:pointer;
font-family:inherit;line-height:1;user-select:none;-webkit-user-select:none;
background:rgba(10,6,32,.72);border:1px solid rgba(255,255,255,.55);
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 14px rgba(180,140,255,.28);
transition:.28s cubic-bezier(.2,.7,.3,1);}
.hub figure .zoom::before{content:"";}
.hub
